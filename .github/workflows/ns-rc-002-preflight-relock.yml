name: NS-RC-002 bounded preflight and relock

on:
  push:
    branches: [rc/immutable-mac-policy]

permissions:
  contents: write

jobs:
  preflight-relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc/immutable-mac-policy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: MAC source policy preflight
        run: |
          python3 tools/verify_mac_identity_policy.py
          python3 tests/mac_identity_policy_guard_test.py
      - name: SSD20x evidence v2 preflight
        run: |
          python3 tests/ssd20x_rc_evidence_validator_test.py
          sh -n tools/rc/ssd20x_collect.sh
      - name: Relock only governed RC policy assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          lock_path = Path('.eep/adoption-lock.json')
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          docs = lock.setdefault('documents', {})
          paths = [
              '.github/workflows/eep-ci.yml',
              'docs/engineering/mac-identity-policy.md',
              'docs/contracts/ssd20x-rc-evidence-v2.json',
              'tools/verify_mac_identity_policy.py',
          ]
          for rel in paths:
              data = Path(rel).read_bytes()
              docs[rel] = hashlib.sha256(data).hexdigest()
          lock_path.write_text(json.dumps(lock, indent=2) + '\n', encoding='utf-8')
          PY
          python3 tools/verify_product_adoption.py
      - name: Commit adoption relock only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .eep/adoption-lock.json
          test "$(git diff --cached --name-only)" = '.eep/adoption-lock.json'
          git commit -m 'NS-RC-002: lock immutable MAC release assets'
          git push origin HEAD:rc/immutable-mac-policy
