name: EEP Product CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify EEP adoption metadata
        run: python3 tools/verify_product_adoption.py
      - name: Verify product IPC source contract
        run: python3 tools/verify_ipc_source_contract.py
      - name: Verify architecture boundaries
        run: python3 tools/verify_architecture_boundaries.py

  strict-host-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build/strict
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS='-Wall -Wextra -Wpedantic -Werror'
      - name: Build
        run: cmake --build build/strict --parallel 2
      - name: IPC v1 and state EVENT contracts
        run: ctest --test-dir build/strict --output-on-failure
      - name: HELLO READY session regression
        run: >-
          python3 tests/ipc_v1_session_test.py
          --binary ./app/smartcontrol/dnake/bin/network_service
      - name: IPC v0 v1 coexistence regression
        run: >-
          python3 tests/ipc_v0_v1_coexistence_test.py
          --binary ./app/smartcontrol/dnake/bin/network_service
          --networkctl ./tools/networkctl.py
      - name: IPC v1 full contract release gate
        run: >-
          python3 tests/ipc_v1_contract_test.py
          --binary ./app/smartcontrol/dnake/bin/network_service
      - name: IPC v1 EVENT sequencing regression
        run: >-
          python3 tests/ipc_v1_event_test.py
          --binary ./app/smartcontrol/dnake/bin/network_service
      - name: IPC v1 reconnect snapshot rebase regression
        run: >-
          python3 tests/ipc_v1_rebase_test.py
          --binary ./app/smartcontrol/dnake/bin/network_service
      - name: IPC v1 bounded outbound backpressure regression
        run: >-
          python3 tests/ipc_v1_backpressure_test.py
          --binary ./app/smartcontrol/dnake/bin/network_service
      - name: IPC v1 long-lived multi-client lifecycle regression
        run: >-
          python3 tests/ipc_v1_lifecycle_test.py
          --binary ./app/smartcontrol/dnake/bin/network_service

  asan-ubsan-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build/sanitize
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS='-Wall -Wextra -Wpedantic -fsanitize=address,undefined -fno-omit-frame-pointer -g'
          -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
      - name: Build
        run: cmake --build build/sanitize --parallel 2
      - name: IPC v1 and state EVENT contracts under sanitizers
        run: >-
          env ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1
          ctest --test-dir build/sanitize --output-on-failure
      - name: HELLO READY session regression under sanitizers
        run: >-
          env ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1
          python3 tests/ipc_v1_session_test.py
          --binary ./app/smartcontrol/dnake/bin/network_service
      - name: IPC v0 v1 coexistence regression under sanitizers
        run: >-
          env ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1
          python3 tests/ipc_v0_v1_coexistence_test.py
          --binary ./app/smartcontrol/dnake/bin/network_service
          --networkctl ./tools/networkctl.py
      - name: IPC v1 full contract release gate under sanitizers
        run: >-
          env ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1
          python3 tests/ipc_v1_contract_test.py
          --binary ./app/smartcontrol/dnake/bin/network_service
      - name: IPC v1 EVENT sequencing regression under sanitizers
        run: >-
          env ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1
          python3 tests/ipc_v1_event_test.py
          --binary ./app/smartcontrol/dnake/bin/network_service
      - name: IPC v1 reconnect snapshot rebase regression under sanitizers
        run: >-
          env ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1
          python3 tests/ipc_v1_rebase_test.py
          --binary ./app/smartcontrol/dnake/bin/network_service
      - name: IPC v1 bounded outbound backpressure regression under sanitizers
        run: >-
          env ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1
          python3 tests/ipc_v1_backpressure_test.py
          --binary ./app/smartcontrol/dnake/bin/network_service
      - name: IPC v1 long-lived multi-client lifecycle regression under sanitizers
        run: >-
          env ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1
          python3 tests/ipc_v1_lifecycle_test.py
          --binary ./app/smartcontrol/dnake/bin/network_service
      - name: Non-mutating CLI smoke under sanitizers
        shell: bash
        run: |
          set +e
          ASAN_OPTIONS=detect_leaks=1 ./app/smartcontrol/dnake/bin/network_service --help
          rc=$?
          set -e
          test "$rc" -eq 1
      - name: Bounded IPC regression under sanitizers
        run: >-
          env ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1
          python3 tests/ipc_stalled_client_test.py
          --binary ./app/smartcontrol/dnake/bin/network_service

  clang-static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyzer version
        run: clang++ --version
      - name: Analyze translation units
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            src/main.cpp \
            src/service/network_daemon.cpp \
            src/service/network_state_change_detector.cpp \
            src/ipc/network_ipc_server.cpp \
            src/ipc/network_ipc_v1_codec.cpp \
            src/ipc/network_ipc_v1_event.cpp \
            src/ipc/network_ipc_v1_outbound.cpp \
            src/ipc/network_ipc_v1_rebase.cpp \
            src/ipc/network_ipc_v1_session.cpp \
            src/platform/interface_snapshot.cpp \
            src/config/ethernet_config.cpp \
            src/platform/ethernet_apply.cpp \
            src/platform/wifi_backend.cpp \
            src/platform/wpa_event_monitor.cpp; do
            clang++ --analyze -std=c++17 -Iinclude -Isrc "$f"
          done
