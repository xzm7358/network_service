name: NS-RC-001 generated artifact cleanup

on:
  push:
    branches:
      - rc/nonblocking-wifi-scan
    paths:
      - '.github/workflows/ns-rc-001-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc/nonblocking-wifi-scan
          fetch-depth: 0
      - name: Remove generated build artifacts
        run: |
          git rm -r --ignore-unmatch build
          git rm --ignore-unmatch app/smartcontrol/dnake/bin/network_service
          cat > .gitignore <<'EOF'
          /build/
          /app/smartcontrol/dnake/bin/network_service
          EOF
          rm -f .github/workflows/ns-rc-001-cleanup.yml
      - name: Verify only source/config changes remain
        run: |
          if git ls-files 'build/*' | grep -q .; then
            echo 'tracked build artifacts remain' >&2
            exit 1
          fi
          if git ls-files app/smartcontrol/dnake/bin/network_service | grep -q .; then
            echo 'tracked host binary remains' >&2
            exit 1
          fi
          git diff --check
      - name: Commit cleanup and self-cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore
          git add -u
          git commit -m "NS-RC-001: remove generated host build artifacts"
          git push origin HEAD:rc/nonblocking-wifi-scan
