name: NS-RC-001 bounded patch

on:
  push:
    branches:
      - rc/nonblocking-wifi-scan
    paths:
      - '.github/workflows/ns-rc-001-apply.yml'
      - 'tools/ns_rc_001_apply.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc/nonblocking-wifi-scan
          fetch-depth: 0
      - name: Narrow ambiguous CMake anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/ns_rc_001_apply.py')
          text = path.read_text(encoding='utf-8')
          old = '''replace_once(
              "CMakeLists.txt",
              "    src/service/network_state_change_detector.cpp\\n",
              "    src/service/network_state_change_detector.cpp\\n    src/service/wifi_scan_lifecycle.cpp\\n",
          )'''
          new = '''replace_once(
              "CMakeLists.txt",
              "add_executable(${NETWORK_SERVICE_TARGET}\\n    src/main.cpp\\n    src/service/network_daemon.cpp\\n    src/service/network_state_change_detector.cpp\\n",
              "add_executable(${NETWORK_SERVICE_TARGET}\\n    src/main.cpp\\n    src/service/network_daemon.cpp\\n    src/service/network_state_change_detector.cpp\\n    src/service/wifi_scan_lifecycle.cpp\\n",
          )'''
          if text.count(old) != 1:
              raise RuntimeError(f'expected one ambiguous CMake patch block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply bounded NS-RC-001 patch
        run: python3 tools/ns_rc_001_apply.py
      - name: Preserve generated C++ JSON escaping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/service/network_daemon.cpp')
          text = path.read_text(encoding='utf-8')
          old = r'''static std::string wifi_scan_lifecycle_json(const WifiScanStatus &status) {
              std::ostringstream os;
              os << "{"scanId":" << status.scan_id
                 << ","state":"" << wifi_scan_state_name(status.state) << """
                 << ","error":"" << json_escape(status.error) << """
                 << ","results":" << wifi_scan_to_json(status.records)
                 << "}";
              return os.str();
          }'''
          new = r'''static std::string wifi_scan_lifecycle_json(const WifiScanStatus &status) {
              std::ostringstream os;
              os << "{\"scanId\":" << status.scan_id
                 << ",\"state\":\"" << wifi_scan_state_name(status.state) << "\""
                 << ",\"error\":\"" << json_escape(status.error) << "\""
                 << ",\"results\":" << wifi_scan_to_json(status.records)
                 << "}";
              return os.str();
          }'''
          if text.count(old) != 1:
              raise RuntimeError(f'expected one malformed lifecycle JSON helper, found {text.count(old)}')
          text = text.replace(old, new, 1)
          old_start = '    return std::string("{"status":202,"result":") +\n'
          new_start = '    return std::string("{\\\"status\\\":202,\\\"result\\\":") +\n'
          if text.count(old_start) != 1:
              raise RuntimeError(f'expected one malformed start envelope, found {text.count(old_start)}')
          path.write_text(text.replace(old_start, new_start, 1), encoding='utf-8')
          PY
      - name: Verify diff shape
        run: git diff --check
      - name: Configure host tests
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build host tests
        run: cmake --build build --parallel
      - name: Run CTest regressions
        run: ctest --test-dir build --output-on-failure
      - name: Verify v1 business dispatch surface
        run: python3 tests/ipc_v1_business_dispatch_test.py --binary app/smartcontrol/dnake/bin/network_service
      - name: Commit implementation and self-cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "NS-RC-001: add non-blocking Wi-Fi scan lifecycle"
          git push origin HEAD:rc/nonblocking-wifi-scan
