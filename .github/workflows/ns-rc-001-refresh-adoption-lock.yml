name: NS-RC-001 refresh adoption lock

on:
  push:
    branches:
      - rc/nonblocking-wifi-scan
    paths:
      - '.github/workflows/ns-rc-001-refresh-adoption-lock.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc/nonblocking-wifi-scan
          fetch-depth: 0
      - name: Refresh governed asset hashes
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          lock_path = Path('.eep/adoption-lock.json')
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          for rel in (
              '.github/workflows/eep-ci.yml',
              'docs/engineering/thread-model.md',
          ):
              lock['documents'][rel] = hashlib.sha256(Path(rel).read_bytes()).hexdigest()
          lock_path.write_text(json.dumps(lock, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Verify refreshed adoption metadata
        run: python3 tools/verify_product_adoption.py
      - name: Commit lock only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add .eep/adoption-lock.json
          git commit -m "NS-RC-001: refresh EEP adoption lock"
          git push origin HEAD:rc/nonblocking-wifi-scan
