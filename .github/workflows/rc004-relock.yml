name: NS-RC-004 bounded adoption relock

on:
  push:
    branches:
      - rc/ssd20x-evidence-harness
    paths:
      - '.github/workflows/rc004-relock.yml'

permissions:
  contents: write

jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc/ssd20x-evidence-harness
      - name: Recompute only intentionally modified locked documents
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          lock_path = Path('.eep/adoption-lock.json')
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          for rel in (
              '.github/workflows/eep-ci.yml',
              'docs/engineering/resource-budget.md',
          ):
              lock['documents'][rel] = hashlib.sha256(Path(rel).read_bytes()).hexdigest()
          lock_path.write_text(json.dumps(lock, indent=2) + '\n', encoding='utf-8')
          PY
          python3 tools/verify_product_adoption.py
      - name: Commit relock and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/rc004-relock.yml
          git add .eep/adoption-lock.json
          git commit -m 'NS-RC-004: refresh adoption lock for RC evidence gate'
          git push origin HEAD:rc/ssd20x-evidence-harness
