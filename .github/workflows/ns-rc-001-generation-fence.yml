name: NS-RC-001 generation fence

on:
  push:
    branches:
      - rc/nonblocking-wifi-scan
    paths:
      - '.github/workflows/ns-rc-001-generation-fence.yml'
      - 'tools/ns_rc_001_generation_fence.py'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc/nonblocking-wifi-scan
          fetch-depth: 0
      - name: Decouple protected EEP workflow update
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/ns_rc_001_generation_fence.py')
          text = path.read_text(encoding='utf-8')
          block = '''replace_once(
              ".github/workflows/eep-ci.yml",
              ''' + "'''" + '''            src/service/network_state_change_detector.cpp \\\\\n            src/ipc/network_ipc_server.cpp \\\\\n''' + "'''" + ''',
              ''' + "'''" + '''            src/service/network_state_change_detector.cpp \\\\\n            src/service/wifi_scan_lifecycle.cpp \\\\\n            src/ipc/network_ipc_server.cpp \\\\\n''' + "'''" + ''',
          )

'''
          if text.count(block) != 1:
              raise RuntimeError(f'expected one EEP workflow patch block, found {text.count(block)}')
          path.write_text(text.replace(block, '', 1), encoding='utf-8')
          PY
      - name: Apply generation fence fix
        run: python3 tools/ns_rc_001_generation_fence.py
      - name: Verify diff shape
        run: git diff --check
      - name: Configure strict host regression
        run: >-
          cmake -S . -B build/ns-rc-001
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS='-Wall -Wextra -Wpedantic -Werror'
      - name: Build strict host regression
        run: cmake --build build/ns-rc-001 --parallel 2
      - name: Run deterministic regressions
        run: ctest --test-dir build/ns-rc-001 --output-on-failure
      - name: Verify v1 business dispatch surface
        run: python3 tests/ipc_v1_business_dispatch_test.py --binary app/smartcontrol/dnake/bin/network_service
      - name: Commit source-only fix and self-cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/platform/wpa_event_monitor.h src/platform/wpa_event_monitor.cpp
          git add src/service/wifi_scan_lifecycle.h src/service/wifi_scan_lifecycle.cpp src/service/network_daemon.cpp
          git add tests/wifi_scan_lifecycle_test.cpp docs/contracts/WIFI_SCAN_LIFECYCLE_V1.md
          git add -u tools/ns_rc_001_generation_fence.py .github/workflows/ns-rc-001-generation-fence.yml
          git commit -m "NS-RC-001: fence late Wi-Fi scan events by generation"
          git push origin HEAD:rc/nonblocking-wifi-scan
